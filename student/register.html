<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="../image_web/icon_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,500&family=Staatliches&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../student_assets/student.css">
<link rel="stylesheet" href="../student_assets/study-chat.css">
</head>
<body>
<header class="nav" id="nav">
  <div class="nav__inner">
    <a href="../index.html" class="nav__logo" aria-label="AM Motion Lab home"><img src="../image_web/full-logo.png" alt="AM Motion Lab" class="nav__logo-full"><img src="../image_web/icon_logo.png" alt="AM Motion Lab" class="nav__logo-icon"></a>
    <nav class="nav__links" aria-label="Primary"><a href="../index.html">Home</a><a href="../learn.html">Learn</a><a href="../courses.html">Courses</a><a href="certificate-center.html" data-nav-certificates>Certificates</a><a href="../projects.html">Projects</a><a href="../about.html">About</a><a href="../faq.html">FAQ</a><a href="../contact.html">Contact</a></nav>

    <button class="nav__burger" id="navBurger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu"><span></span><span></span><span></span></button>
  </div>
  <div class="mobile-menu" id="mobileMenu"><a href="../index.html">Home</a><a href="../learn.html">Learn</a><a href="../courses.html">Courses</a><a href="certificate-center.html" data-nav-certificates>Certificates</a><a href="../projects.html">Projects</a><a href="../about.html">About</a><a href="../faq.html">FAQ</a><a href="../contact.html">Contact</a><a href="../contact.html" class="btn btn--primary">Start Learning</a></div>

<main class="auth">
  <div class="auth__card">
    <a class="auth__brand" href="../index.html"><img src="../image_web/icon_logo.png" alt=""><span>AM Motion Lab</span></a>
    <h1>Create your account</h1>
    <p class="sub">Learn â€¢ Create â€¢ Earn</p>
    <form id="f" novalidate>
      <div id="credentialsStep">
      <div class="field"><label for="name">Full name</label><input id="name" name="name" type="text" autocomplete="name" required></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="10-digit mobile number" required></div>
      <div class="row">
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required></div>
        <div class="field"><label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" required></div>
      </div>
      <button class="btn" id="btn" type="submit">Create account</button>
      </div>
      <div id="otpStep" hidden>
        <div class="field"><label for="otpCode">Email verification code</label><input id="otpCode" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code"></div>
        <button class="btn" id="verifyOtp" type="submit">Verify and continue</button>
        <button class="btn btn--secondary" id="resendOtp" type="button">Resend code</button>
      </div>
      <p class="msg" id="msg" role="status"></p>
    </form>
    <div class="google-auth">
      <div id="googleSignInButton" class="google-auth__button"></div>
      <div class="google-auth__divider">or continue with Google</div>
      <p class="google-auth__message" id="googleAuthMessage" role="status"></p>
    </div>
    <p class="alt">Already have an account? <a id="alt" href="login.html">Log in</a></p>
  </div>
</main>
<script src="../student_assets/student.js"></script>
<script src="../script.js"></script>
<script src="../student_assets/google-auth.js" defer></script>
<script>
(function () {
  var form = document.getElementById("f"), msg = document.getElementById("msg"), btn = document.getElementById("btn");
  var credentialsStep = document.getElementById("credentialsStep"), otpStep = document.getElementById("otpStep");
  var verifyOtp = document.getElementById("verifyOtp"), resendOtp = document.getElementById("resendOtp");
  var otpMode = false, otpEmail = "";
  document.getElementById("alt").href = "login.html" + location.search;
  var next = new URLSearchParams(location.search).get("next");
  if (next === "certificates") document.querySelectorAll("[data-nav-certificates]").forEach(function (link) { link.setAttribute("aria-current", "page"); });
  var dest = next === "certificates" ? "certificate-center.html" : "../courses.html";
  function fail(t) { msg.className = "msg err"; msg.textContent = t; btn.disabled = false; }
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    msg.className = "msg";
    if (otpMode) {
      msg.textContent = "Verifying code..."; verifyOtp.disabled = true;
      try {
        var verified = await AMML.api("/api/auth/login/verify-otp", { method: "POST", body: { email: otpEmail, code: form.code.value.trim() } });
        AMML.setToken(verified.token); location.href = dest;
      } catch (err) { msg.className = "msg err"; msg.textContent = err.message; verifyOtp.disabled = false; }
      return;
    }
    if (form.password.value.length < 8) return fail("Password must be at least 8 characters.");
    if (form.password.value !== form.confirm.value) return fail("Passwords do not match.");
    msg.textContent = "Creating your account and sending a verification code..."; btn.disabled = true;
    try {
      var d = await AMML.api("/api/auth/register", { method: "POST", body: {
        name: form.name.value, email: form.email.value, phone: form.phone.value,
        password: form.password.value, confirmPassword: form.confirm.value
      }});
      otpEmail = d.email; otpMode = true; credentialsStep.hidden = true; otpStep.hidden = false;
      msg.textContent = "We sent a 6-digit code to " + otpEmail + ". It expires in 10 minutes.";
      form.code.focus();
    } catch (err) { fail(err.message); }
  });
  resendOtp.addEventListener("click", async function () {
    resendOtp.disabled = true; msg.className = "msg"; msg.textContent = "Requesting a new code...";
    try {
      var result = await AMML.api("/api/auth/login/resend-otp", { method: "POST", body: { email: otpEmail, password: form.password.value } });
      msg.textContent = result.message;
    } catch (err) { msg.className = "msg err"; msg.textContent = err.message; }
    finally { resendOtp.disabled = false; }
  });
})();
</script>
<script src="../student_assets/study-chat.js"></script>
</body>
</html>
