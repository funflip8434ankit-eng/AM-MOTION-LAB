<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://checkout.razorpay.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://am-motion-lab-9ui2.onrender.com https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com https://generativelanguage.googleapis.com https://*.razorpay.com; frame-src https://accounts.google.com https://*.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com https://*.razorpay.com">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificate — AM Motion Lab</title>
<link rel="icon" href="../image_web/icon_logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../student_assets/student.css">
<link rel="stylesheet" href="../student_assets/study-chat.css">
</head>
<body class="certificate-page">
<main class="certificate-view">
  <div>
    <article class="certificate-sheet" id="certificate" hidden>
      <div class="certificate-sheet__content">
        <header class="certificate-sheet__header">
          <img src="../image_web/icon_logo.png" alt="" class="certificate-sheet__logo">
          <div class="certificate-sheet__brand-wrap">
            <p class="certificate-sheet__brand">AM Motion Lab</p>
            <p class="certificate-sheet__brand-sub">Student achievement</p>
          </div>
        </header>
        <p class="certificate-sheet__eyebrow">Certificate of completion</p>
        <h1>Certificate <span>of Achievement</span></h1>
        <p class="certificate-sheet__lead">Proudly presented to</p>
        <p class="certificate-sheet__name" id="student-name"></p>
        <p class="certificate-sheet__lead certificate-sheet__lead--small">for successfully completing the course</p>
        <p class="certificate-sheet__course" id="course-name"></p>
        <p class="certificate-sheet__level"><span>Learning track</span><strong id="course-level"></strong></p>
        <footer class="certificate-sheet__footer">
          <div class="certificate-sheet__meta">
            <span>DATE OF ISSUE<strong id="issued-date"></strong></span>
            <span>CERTIFICATE NUMBER<strong id="certificate-number"></strong></span>
          </div>
          <div class="certificate-sheet__signature">
            <div class="certificate-sheet__seal" aria-hidden="true"><span>AM</span><small>AWARDED</small></div>
            <div class="certificate-sheet__signoff"><span></span><small>AM Motion Lab</small></div>
          </div>
        </footer>
      </div>
    </article>
    <p class="sub" id="status" role="status">Loading certificate…</p>
    <div class="certificate-actions" id="actions" hidden>
      <button class="btn" type="button" id="print-certificate">Print / Save as PDF</button>
      <a class="portal-link" href="certificate-center.html">Back to certificates</a>
    </div>
  </div>
</main>
<script src="../student_assets/student.js"></script>
<script>
(async function () {
  if (!AMML.getToken()) { location.replace("login.html"); return; }
  var status = document.getElementById("status");
  document.getElementById("print-certificate").addEventListener("click", function () { window.print(); });
  try {
    var id = new URLSearchParams(location.search).get("id");
    if (!id || !/^\d+$/.test(id)) throw new Error("Certificate not found.");
    var result = await AMML.api("/api/learning/certificates/" + encodeURIComponent(id));
    var certificate = result.certificate;
    document.getElementById("student-name").textContent = certificate.student_name;
    document.getElementById("course-name").textContent = certificate.course_name;
    document.getElementById("course-level").textContent = AMML.levelName(certificate.level_id);
    document.getElementById("issued-date").textContent = new Date(certificate.issued_at).toLocaleDateString("en-IN", { day: "2-digit", month: "long", year: "numeric" });
    document.getElementById("certificate-number").textContent = certificate.certificate_number;
    document.getElementById("certificate").hidden = false;
    document.getElementById("actions").hidden = false;
    status.hidden = true;
  } catch (error) {
    if (error.status === 401) {
      AMML.clearToken();
      location.replace("login.html");
    } else {
      status.textContent = error.message;
    }
  }
})();
</script>
<script src="../student_assets/study-chat.js"></script>
</body>
</html>
